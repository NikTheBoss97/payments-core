# Author: Nicola Antonello

[package]
name = "mock-merchant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The fake's route (ADR-0056), served as the server's own are: HTTP/1.1 only, and none of
# the default extractors.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# A delivery's signature (ADR-0051, ADR-0056): the secret's base64, the MAC and its hash.
# The server and the mock PSP build these crates already.
base64 = "0.23"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
# The fake's clock and the window around it, and the event's time in RFC 3339
# (ADR-0059). The server builds this crate already.
time = { version = "0.3.55", default-features = false, features = ["parsing", "serde", "std"] }
# The event's body, read strictly (ADR-0049). sqlx builds these crates already.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derives Display and Error for the error types. sqlx depends on it too.
thiserror = "2.0.21"
# Serves the route, waits out a delayed answer, stops the server on its handle's signal,
# and runs the binary and its timer.
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# The payment and the request that an event names. sqlx builds this crate already.
uuid = { version = "1.28", features = ["serde"] }

[dev-dependencies]
# Secrets from the operating system, made at runtime as every test's keys are (ADR-0030).
# uuid builds this crate already.
getrandom = "0.4"
# Delivering to the fake as the relay will (ADR-0036): the legacy client, with the one
# retry that it makes by itself switched off, and the body that it sends. The mock PSP
# builds these crates already.
http-body-util = "0.1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# The process and the output of the test that runs the binary. Cargo adds these features
# to the ones above.
tokio = { version = "1.54.1", features = ["io-util", "process"] }

[lints]
workspace = true
