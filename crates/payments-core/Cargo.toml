[package]
name = "payments-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# Only the std feature: the default fork, timeout and bit-set features are
# unused and would add rusty-fork, tempfile and bit-set to the build.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }

[lints]
workspace = true
