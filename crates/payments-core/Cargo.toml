# Author: Nicola Antonello

[package]
name = "payments-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The HTTP server (ADR-0023). HTTP/1.1 only, and none of the default extractors: a
# body is read raw, because its fingerprint needs the exact bytes (ADR-0026).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# The secret of an API key, from the operating system (ADR-0024). uuid builds this
# crate already.
getrandom = "0.4"
# Renders a problem, and later reads and answers requests (ADR-0023). sqlx builds these
# crates already.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The fingerprint of a request under an idempotency key (ADR-0026), and the digest
# of an API key (ADR-0024). sqlx builds this crate already.
sha2 = { version = "0.11", default-features = false }
# PostgreSQL access through compile-time checked queries (ADR-0006).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
# Derives Display and Error for the error types (ADR-0015). sqlx depends on
# it too.
thiserror = "2.0.21"
# The server's runtime (ADR-0023). 1.54.0 has a data race in its timers
# (GHSA-5wjr-9356-4wc8), so this asks for the release that reverted it.
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
# The server's log (ADR-0023). sqlx builds tracing already, and this leaves out the
# default features: an environment filter and colours have no use here.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# UUIDv7 IDs, created by the caller (ADR-0005: 1.27 or later).
uuid = { version = "1.28", features = ["v7"] }

[dev-dependencies]
# join_all, to run futures together in the concurrency tests. Only alloc:
# the default features would add the futures-macro crate. sqlx builds this
# crate already.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# Reads a response's body, in the tests that send a request without a socket
# (ADR-0023). axum builds this crate already.
http-body-util = "0.1"
# Only the std feature: the default fork, timeout and bit-set features are
# unused and would add rusty-fork, tempfile and bit-set to the build.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# #[sqlx::test] applies the migrations to each test database; the library
# never runs them (ADR-0008). Cargo adds this feature to the one above.
sqlx = { version = "0.9", default-features = false, features = ["migrate"] }
# The sockets, timers and signals of the tests that hang up on the server, and the
# process of the test that starts it (ADR-0023). Cargo adds these features to the one
# above.
tokio = { version = "1.54.1", features = ["io-util", "process", "sync", "time"] }
# ServiceExt::oneshot, to send a request to the router without a socket (ADR-0023).
# axum builds this crate already.
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
