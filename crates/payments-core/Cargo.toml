# Author: Nicola Antonello

[package]
name = "payments-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The HTTP server (ADR-0023). HTTP/1.1 only, and none of the default extractors: a
# body is read raw, because its fingerprint needs the exact bytes (ADR-0026).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# The base64 of the keys and the signatures of the PSP's notifications (ADR-0030).
# sqlx builds this crate already.
base64 = "0.23"
# The secret of an API key, from the operating system (ADR-0024). uuid builds this
# crate already.
getrandom = "0.4"
# The MAC that signs a notification, compared through its constant-time output
# (ADR-0030). sqlx builds this crate already.
hmac = "0.13"
# Reads the PSP's histories (ADR-0036): the legacy client, with the one retry that it
# makes by itself switched off, and the body, bounded in size (ADR-0041). Also reads a
# response's body in the tests that send a request without a socket (ADR-0023). axum
# builds http-body-util already, and the fake PSP builds hyper-util.
http-body-util = "0.1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# Renders a problem, and later reads and answers requests (ADR-0023). sqlx builds these
# crates already.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The fingerprint of a request under an idempotency key (ADR-0026), and the digest
# of an API key (ADR-0024). sqlx builds this crate already.
sha2 = { version = "0.11", default-features = false }
# PostgreSQL access through compile-time checked queries (ADR-0006).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
# Compares the operator's key in constant time (ADR-0024). Only the comparison: the
# default features add what this does not use.
subtle = { version = "2.6", default-features = false }
# Derives Display and Error for the error types (ADR-0015). sqlx depends on
# it too.
thiserror = "2.0.21"
# The server's runtime (ADR-0023). 1.54.0 has a data race in its timers
# (GHSA-5wjr-9356-4wc8), so this asks for the release that reverted it. Its timer
# bounds each call to the PSP (ADR-0036), and its semaphore the catch-ups that
# notifications start (ADR-0043).
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# The server's log (ADR-0023). sqlx builds tracing already, and this leaves out the
# default features: an environment filter and colours have no use here.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# UUIDv7 IDs, created by the caller (ADR-0005: 1.27 or later), and read from the PSP's
# histories (ADR-0038).
uuid = { version = "1.28", features = ["serde", "v7"] }

[dev-dependencies]
# join_all, to run futures together in the concurrency tests. Only alloc:
# the default features would add the futures-macro crate. sqlx builds this
# crate already.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# The fake PSP, which each test starts and scripts (ADR-0029). Only here, so the
# server reaches it only over HTTP, and the two share the wire format and no code. The
# version keeps cargo-deny from reading the path as a wildcard (ADR-0027).
mock-psp = { path = "../mock-psp", version = "0.1.0" }
# Only the std feature: the default fork, timeout and bit-set features are
# unused and would add rusty-fork, tempfile and bit-set to the build.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# #[sqlx::test] applies the migrations to each test database; the library
# never runs them (ADR-0008). Cargo adds this feature to the one above.
sqlx = { version = "0.9", default-features = false, features = ["migrate"] }
# The sockets, timers and signals of the tests that hang up on the server, and the
# process of the test that starts it (ADR-0023). Cargo adds these features to the one
# above.
tokio = { version = "1.54.1", features = ["io-util", "process", "sync", "time"] }
# ServiceExt::oneshot, to send a request to the router without a socket (ADR-0023).
# axum builds this crate already.
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
