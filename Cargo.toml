# Author: Nicola Antonello

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# sqlx 0.9.0 leaves a pooled connection inside an open transaction when
# begin() is cancelled (sqlx #4393). Until 0.9.1 is released, every sqlx
# crate comes from the commit that merged the fix (#4394). See ADR-0006.
[patch.crates-io]
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }
sqlx-macros = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }
sqlx-macros-core = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }
sqlx-postgres = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }

# Release builds wrap on integer overflow by default. Panic instead, so a
# missed check aborts the database transaction rather than corrupting an
# amount (ADR-0003). As in the dev and test profiles, this covers every
# crate in the build, dependencies included; `cargo bench` inherits it.
# CI runs crates/payments-core/tests/overflow_checks.rs in release to check it.
[profile.release]
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `as` truncates and wraps silently, and overflow checks do not catch it:
# convert with From or TryFrom instead (ADR-0003). A justified exception,
# such as u64 to f64 in benchmark statistics, states its reason.
as_conversions = "deny"
# Every #[allow] or #[expect] says why, with reason = "...".
allow_attributes_without_reason = "deny"
