# Author: Nicola Antonello

# Local development database. Credentials are for local use only.
services:
  postgres:
    image: postgres:18-alpine
    # One `cargo test --workspace` opens up to 99 connections at once, and the default
    # limit is 100. 300 leaves room for a second run (ADR-0040).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      # From 18 on, the image keeps its data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      # Run once, on first start with an empty volume (ADR-0008).
      - ./docker/postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
