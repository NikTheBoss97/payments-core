# Author: Nicola Antonello

# Local development database. Credentials are for local use only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      # From 18 on, the image keeps its data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
