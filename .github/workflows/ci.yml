# Author: Nicola Antonello

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository: they never push, comment or publish, so
# the GITHUB_TOKEN gets no more than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Compile query! macros against the committed .sqlx cache (ADR-0006).
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments
    steps:
      - uses: actions/checkout@v4
      - name: Create database roles (ADR-0008)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U payments -d payments -v ON_ERROR_STOP=1
          < docker/postgres/roles.sql
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Release builds wrap on integer overflow unless the root Cargo.toml
      # turns the checks on. This test overflows on purpose and fails if they
      # wrap (ADR-0003).
      - run: cargo test -p payments-core --release --locked --test overflow_checks

  # Fails when the committed .sqlx cache no longer matches what the
  # migrations produce. Offline builds cannot notice that (ADR-0006).
  sqlx-cache:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments
      # The sqlx commit pinned in Cargo.toml; sqlx-cli must match it.
      SQLX_REV: f1e94ec34dd5f11ad6488a3a8ac7988439a3f757
    steps:
      - uses: actions/checkout@v4
      - name: Create database roles (ADR-0008)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U payments -d payments -v ON_ERROR_STOP=1
          < docker/postgres/roles.sql
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sqlx repository has no Cargo.lock, so the CLI build cannot be
      # locked; the built binary is cached under the commit hash instead.
      - name: Restore sqlx-cli
        id: sqlx-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_REV }}
      - name: Install sqlx-cli
        if: steps.sqlx-cli.outputs.cache-hit != 'true'
        # -D warnings is this project's policy for its own code. Applied to
        # a third-party tool, a new deprecation in Rust stable breaks the build.
        env:
          RUSTFLAGS: ""
        run: >-
          cargo install sqlx-cli
          --git https://github.com/transact-rs/sqlx --rev "$SQLX_REV"
          --no-default-features --features postgres,rustls
      - name: Apply migrations
        working-directory: crates/payments-core
        run: sqlx migrate run
      - name: Check the offline cache
        working-directory: crates/payments-core
        run: cargo sqlx prepare --check -- --all-targets
