# Author: Nicola Antonello

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository: they never push, comment or publish, so
# the GITHUB_TOKEN gets no more than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Compile query! macros against the committed .sqlx cache (ADR-0006).
  SQLX_OFFLINE: "true"
  # The cache never restores incremental data, so producing it is wasted work.
  CARGO_INCREMENTAL: "0"

# Each action is pinned to the commit of a release, named in a comment: a
# tag can be moved to other code, a commit cannot (GitHub's secure use
# reference). Dependabot updates both (.github/dependabot.yml).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup comes with the runner image. Naming the channel makes it fetch
      # the latest stable, the toolchain that rust-toolchain.toml selects.
      - name: Install Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create database roles (ADR-0008)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U payments -d payments -v ON_ERROR_STOP=1
          < docker/postgres/roles.sql
      - name: Install Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      # Release builds wrap on integer overflow unless the root Cargo.toml
      # turns the checks on. This test overflows on purpose and fails if they
      # wrap (ADR-0003).
      - run: cargo test -p payments-core --release --locked --test overflow_checks

  # Fails when the committed .sqlx cache no longer matches what the
  # migrations produce. Offline builds cannot notice that (ADR-0006).
  sqlx-cache:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments
      # The sqlx commit pinned in Cargo.toml; sqlx-cli must match it.
      SQLX_REV: f1e94ec34dd5f11ad6488a3a8ac7988439a3f757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create database roles (ADR-0008)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U payments -d payments -v ON_ERROR_STOP=1
          < docker/postgres/roles.sql
      - name: Install Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The sqlx repository has no Cargo.lock, so the CLI build cannot be
      # locked; the built binary is cached under the commit hash instead.
      - name: Restore sqlx-cli
        id: sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_REV }}
      - name: Install sqlx-cli
        if: steps.sqlx-cli.outputs.cache-hit != 'true'
        # -D warnings is this project's policy for its own code. Applied to
        # a third-party tool, a new deprecation in Rust stable breaks the build.
        env:
          RUSTFLAGS: ""
        run: >-
          cargo install sqlx-cli
          --git https://github.com/transact-rs/sqlx --rev "$SQLX_REV"
          --no-default-features --features postgres,rustls
      - name: Apply migrations
        working-directory: crates/payments-core
        run: sqlx migrate run
      - name: Check the offline cache
        working-directory: crates/payments-core
        run: cargo sqlx prepare --check -- --all-targets
